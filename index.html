<!doctype html>
<html lang="zh-Hant-TW" data-ui="tech-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C5BBF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>ToDo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one working column — header summary, quick add, urgency groups (most urgent first), then 已完成 and 垃圾桶 drawers */
:root{
  /* 經典明亮（預設基底）；科技亮／科技暗由 html[data-ui] 覆寫 */
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-solid:#FFFFFF; --sunk:#E9EDF2;
  --line:#D8DEE6; --line-strong:#C3CCD8;
  --fg:#1B2330; --muted:#5F6B7B; --faint:#8E99A8;
  --accent:#2C5BBF; --accent-2:#2C5BBF; --accent-fg:#FFFFFF; --danger:#C2412F;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-display:var(--f-body);
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px; --tint:24%;
  color-scheme:light;
}
html[data-ui="tech-light"]{
  --bg:#F3F5F8; --surface:rgba(255,255,255,.88); --surface-solid:#FFFFFF; --sunk:#E9EDF2;
  --line:#D8DEE6; --line-strong:rgba(44,91,191,.32);
  --fg:#1B2330; --muted:#5F6B7B; --faint:#8E99A8;
  --accent:#2C5BBF; --accent-2:#1BA6C9; --accent-fg:#FFFFFF; --danger:#C2412F;
  --f-display:"Chakra Petch","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --r:4px; --tint:22%; color-scheme:light;
}
html[data-ui="tech-dark"]{
  --bg:#060A11; --surface:rgba(14,21,33,.80); --surface-solid:#0D1420; --sunk:#141D2B;
  --line:rgba(110,160,230,.16); --line-strong:rgba(90,200,255,.32);
  --fg:#E4ECF7; --muted:#8C9BB0; --faint:#56657A;
  --accent:#38D6F5; --accent-2:#5B7CFF; --accent-fg:#031018; --danger:#FF5C6C;
  --f-display:"Chakra Petch","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --r:4px; --tint:14%; color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:.02em}
.today{color:var(--muted);font-size:13px;margin-top:2px}
.tools{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.danger{color:var(--danger)}
.summary{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 16%,var(--surface));color:color-mix(in srgb,var(--c) 65%,var(--fg))}
.chip b{font-family:var(--f-mono);font-weight:600}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:var(--r);
  background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));font-size:14px}

/* quick add */
.add{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.add input[type=text]{flex:1 1 240px;min-width:0;border:0;background:transparent;padding:6px 4px;font-size:16px}
.add input[type=text]:focus{outline:none}
.date-in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-family:var(--f-mono);font-size:13px}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.quick button{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.quick button:hover{color:var(--fg)}

/* groups */
.group{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;border-radius:14px;
  background:color-mix(in srgb,var(--c) var(--tint),var(--bg));border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.group.empty{padding-block:6px;background:color-mix(in srgb,var(--c) calc(var(--tint) / 2),var(--bg))}
.ghead{display:flex;align-items:center;gap:10px;padding:4px 2px;flex-wrap:wrap}
.ghead h2{font-size:15px;font-weight:700;margin:0;color:color-mix(in srgb,var(--c) 55%,var(--fg))}
.ghead .range{font-size:12px;color:color-mix(in srgb,var(--c) 30%,var(--muted))}
.ghead .count{font-family:var(--f-mono);font-size:12px;color:var(--fg);background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:6px;padding:0 7px}
.ghead .hide{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
.ghead .hide[aria-pressed="true"]{color:var(--fg);border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.groups{display:flex;flex-direction:column;gap:16px;width:100%}
.list{display:flex;flex-direction:column;gap:6px}

.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:opacity .2s}
.task.done{opacity:.45}
.task.done .ttl-text{text-decoration:line-through}
.task.open{opacity:1;border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 4px 18px -10px rgba(20,40,80,.35)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;cursor:pointer}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;background:var(--surface)}
.check svg{width:13px;height:13px;opacity:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.check[aria-pressed="true"] svg{opacity:1}
.ttl{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.ttl-text{font-weight:500;overflow-wrap:anywhere;cursor:text;border-radius:4px}
.ttl-text:hover{background:var(--sunk)}
.ttl-edit{font:inherit;font-weight:500;width:100%;box-sizing:border-box;border:1px solid var(--accent);border-radius:6px;padding:2px 6px;background:var(--bg)}
.subs-mini{cursor:pointer}
.ttl-meta{font-size:12px;color:var(--muted)}
.due{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.pill{font-size:12px;font-weight:500;padding:1px 9px;border-radius:999px;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--fg))}
.dstr{font-size:11px;color:var(--faint)}

.subs-mini{list-style:none;margin:0;padding:0 12px 9px 42px;display:flex;flex-direction:column;gap:3px}
.subs-mini li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.subs-mini li span.t{flex:1;min-width:0;overflow-wrap:anywhere}
.subs-mini li::before{content:"–";color:var(--faint)}
.subs-mini .pill{font-size:11px;padding:0 7px}

.detail{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field>label,.lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.text-in,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:56px;font-size:14px}
.frow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.sublist{display:flex;flex-direction:column;gap:6px}
.sub{background:var(--bg);border-radius:8px;padding:8px}
.sub.done .sub-title{text-decoration:line-through;opacity:.5}
.sub.done>.subrow>.check,.sub.done .pill{opacity:.5}
.subrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.subrow .sub-title{flex:1 1 180px;min-width:0;border:0;background:transparent;padding:4px 2px;font-size:14px}
.subrow .sub-title:focus{outline:none;border-bottom:1px solid var(--accent)}
.mini{font-size:12px;color:var(--muted);padding:3px 8px;border-radius:6px}
.mini:hover{background:var(--sunk);color:var(--fg)}
.mini.has{color:var(--accent);font-weight:500}
.sub textarea{margin-top:6px;background:var(--surface)}
.addsub{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addsub .text-in{flex:1 1 200px;width:auto;min-width:0}
.dfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* drawers */
details.drawer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.drawer>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
details.drawer>summary::-webkit-details-marker{display:none}
details.drawer>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.drawer[open]>summary::before{transform:rotate(45deg)}
details.drawer .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:0 7px;font-weight:500}
details.drawer .sact{margin-left:auto}
.dlist{padding:0 14px 12px;display:flex;flex-direction:column;gap:4px}
.ditem{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.ditem .t{flex:1 1 200px;min-width:0;color:var(--muted);overflow-wrap:anywhere}
.ditem .when{font-size:11px;color:var(--faint)}
.dexp{flex:1 1 200px;min-width:0;display:flex;align-items:flex-start;gap:8px;text-align:left}
.dexp .t{flex:1}
.dexp:hover .t{color:var(--fg)}
.dexp .caret{flex:none;width:6px;height:6px;margin-top:.55em;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.ditem.open .dexp .caret{transform:rotate(45deg)}
.ddetail{flex-basis:100%;margin:2px 0 6px 14px;padding:10px 12px;border-radius:var(--r);background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.dnote p{margin:2px 0 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.dsubs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dsubs li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.dsubs li.done .st{text-decoration:line-through;color:var(--muted)}
.dsubs .st{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.dcheck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none}
.dsubs li.done .dcheck{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.dcheck svg{width:11px;height:11px}
.snote{flex-basis:100%;margin:0 0 0 24px;font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.ddetail .hint{font-size:12px}
.empty-note{color:var(--faint);font-size:13px;padding:4px 0 6px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.dlg header{padding:16px 18px 10px;align-items:center}
.dlg h3{margin:0;font-size:17px}
.dlg .body{padding:4px 18px 14px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.dlg footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.tier-table{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:36px minmax(0,1fr) 110px minmax(0,1.2fr) 32px;gap:8px;align-items:center}
.trow.head{font-size:12px;color:var(--muted)}
.trow input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.trow .text-in{padding:5px 8px}
.trow .num{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.trow .num input{width:64px;font-family:var(--f-mono)}
.trow .rng{font-size:12px;color:var(--muted)}
.trow .x{color:var(--faint);font-size:18px;line-height:1}
.trow .x:hover{color:var(--danger)}
.radio{display:flex;flex-direction:column;gap:6px;font-size:14px}
.radio label{display:flex;gap:8px;align-items:flex-start}
.err{color:var(--danger);font-size:13px;margin:0}
@media (max-width:560px){
  .trow{grid-template-columns:36px minmax(0,1fr) 92px 28px}
  .trow .rng{grid-column:2/4;margin-top:-4px}
  .trow.head .rng{display:none}
}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  border-radius:10px;padding:9px 14px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.toast button{color:var(--bg);font-weight:700;text-decoration:underline}

/* ===================== 介面：科技・亮 ===================== */
html[data-ui="tech-light"] ::selection{background:rgba(44,91,191,.18)}
html[data-ui="tech-light"]{background:var(--bg)}
html[data-ui="tech-light"] body{background-color:var(--bg);
  background-image:radial-gradient(1100px 520px at 50% -12%,rgba(27,166,201,.10),transparent 62%),
    radial-gradient(700px 400px at 100% 100%,rgba(44,91,191,.07),transparent 60%),
    linear-gradient(rgba(44,91,191,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(44,91,191,.06) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
html[data-ui="tech-light"] *{scrollbar-width:thin;scrollbar-color:rgba(44,91,191,.3) transparent}
html[data-ui="tech-light"] h1{font-family:var(--f-display);font-size:32px;letter-spacing:.14em;line-height:1.1;display:inline-block;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(27,166,201,.25))}
html[data-ui="tech-light"] h1::after{content:"";display:inline-block;width:.45em;height:.1em;margin-left:.12em;background:var(--accent-2);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
html[data-ui="tech-light"] .today{font-family:var(--f-mono);color:var(--muted);letter-spacing:.06em;white-space:pre}
html[data-ui="tech-light"] .btn{background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--r);color:var(--fg);transition:border-color .15s,box-shadow .15s,color .15s}
html[data-ui="tech-light"] .btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px -5px var(--accent-2)}
html[data-ui="tech-light"] .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-fg);font-weight:700;box-shadow:0 4px 16px -8px var(--accent)}
html[data-ui="tech-light"] .btn.primary:hover{color:var(--accent-fg);box-shadow:0 0 20px -4px var(--accent-2)}
html[data-ui="tech-light"] .btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
html[data-ui="tech-light"] .btn.danger:hover{color:var(--danger);border-color:var(--danger);box-shadow:0 0 12px -5px var(--danger)}
html[data-ui="tech-light"] .chip{background:color-mix(in srgb,var(--c) 12%,var(--surface-solid));border:1px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:var(--r);
  color:color-mix(in srgb,var(--c) 70%,var(--fg));box-shadow:0 0 10px -6px var(--c)}
html[data-ui="tech-light"] .banner{background:color-mix(in srgb,var(--accent) 7%,var(--surface-solid));border:1px dashed var(--line-strong);border-radius:var(--r)}
html[data-ui="tech-light"] .add{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);backdrop-filter:blur(8px);
  box-shadow:0 6px 24px -18px var(--accent);transition:border-color .15s,box-shadow .15s}
html[data-ui="tech-light"] .add:focus-within{border-color:var(--accent-2);box-shadow:0 0 22px -8px var(--accent-2)}
html[data-ui="tech-light"] .add::before{content:">";font-family:var(--f-mono);font-weight:600;color:var(--accent-2);padding-left:4px}
html[data-ui="tech-light"] .date-in{background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--r);color:var(--fg)}
html[data-ui="tech-light"] .date-in:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 10px -4px var(--accent-2)}
html[data-ui="tech-light"] .quick button{background:transparent;border:1px solid var(--line);border-radius:var(--r);color:var(--muted)}
html[data-ui="tech-light"] .quick button:hover{border-color:var(--accent);color:var(--accent)}
html[data-ui="tech-light"] .group{position:relative;border-radius:var(--r);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) calc(var(--tint) + 4%),var(--surface-solid)),color-mix(in srgb,var(--c) calc(var(--tint) - 8%),var(--surface-solid)));
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  box-shadow:0 8px 26px -18px var(--c)}
html[data-ui="tech-light"] .group::before,html[data-ui="tech-light"] .group::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--c);pointer-events:none}
html[data-ui="tech-light"] .group::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
html[data-ui="tech-light"] .group::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
html[data-ui="tech-light"] .group.empty{background:color-mix(in srgb,var(--c) 8%,var(--surface-solid));box-shadow:none;opacity:.75}
html[data-ui="tech-light"] .group.empty:hover{opacity:1}
html[data-ui="tech-light"] .group.alert{animation:alertGlowL 2.4s ease-in-out infinite}
@keyframes alertGlowL{0%,100%{box-shadow:0 8px 26px -18px var(--c)}50%{box-shadow:0 0 30px -4px var(--c)}}
html[data-ui="tech-light"] .ghead h2{font-family:var(--f-display);letter-spacing:.1em;color:color-mix(in srgb,var(--c) 60%,var(--fg))}
html[data-ui="tech-light"] .ghead .range{font-family:var(--f-mono);font-size:11.5px;color:color-mix(in srgb,var(--c) 35%,var(--muted))}
html[data-ui="tech-light"] .ghead .count{background:rgba(255,255,255,.7);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:3px;color:var(--fg)}
html[data-ui="tech-light"] .ghead .hide{background:rgba(255,255,255,.75);border-color:color-mix(in srgb,var(--c) 35%,transparent);border-radius:var(--r)}
html[data-ui="tech-light"] .ghead .hide:hover{color:var(--fg)}
html[data-ui="tech-light"] .ghead .hide[aria-pressed="true"]{color:color-mix(in srgb,var(--c) 60%,var(--fg));border-color:var(--c);box-shadow:0 0 10px -5px var(--c)}
html[data-ui="tech-light"] .task{background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,box-shadow .15s,opacity .2s,transform .15s}
html[data-ui="tech-light"] .task:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 16px -8px var(--c)}
html[data-ui="tech-light"] .task.done{opacity:.45}
html[data-ui="tech-light"] .task.open{border-color:var(--accent-2);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent-2) 25%,transparent),0 0 24px -8px var(--accent-2)}
html[data-ui="tech-light"] .ttl-text:hover{background:color-mix(in srgb,var(--accent-2) 10%,transparent)}

html[data-ui="tech-light"] .check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px -1px var(--accent-2)}
html[data-ui="tech-light"] .pill{font-family:var(--f-mono);font-size:11.5px;border-radius:3px;background:color-mix(in srgb,var(--c) 14%,var(--surface-solid));

html[data-ui="tech-light"] .text-in,html[data-ui="tech-light"] textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);color:var(--fg)}
html[data-ui="tech-light"] .text-in:focus,html[data-ui="tech-light"] textarea:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 10px -4px var(--accent-2)}
html[data-ui="tech-light"] .sub{background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
html[data-ui="tech-light"] .mini:hover{background:color-mix(in srgb,var(--accent-2) 10%,transparent);color:var(--accent)}
html[data-ui="tech-light"] .mini.has{color:var(--accent)}
html[data-ui="tech-light"] details.drawer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px)}

html[data-ui="tech-light"] dialog::backdrop{background:rgba(20,35,60,.35);backdrop-filter:blur(3px)}
html[data-ui="tech-light"] .dlg h3{font-family:var(--f-display);letter-spacing:.08em;color:var(--accent)}
html[data-ui="tech-light"] .toast{background:var(--fg);color:var(--bg);border:1px solid var(--accent-2);border-radius:var(--r);box-shadow:0 0 22px -8px var(--accent-2)}
html[data-ui="tech-light"] .toast button{color:#7FDCF0}
/* ===================== 介面：科技・暗 ===================== */
html[data-ui="tech-dark"] ::selection{background:rgba(56,214,245,.3)}
html[data-ui="tech-dark"]{background:var(--bg)}
html[data-ui="tech-dark"] body{background-color:var(--bg);
  background-image:radial-gradient(1100px 520px at 50% -12%,rgba(56,214,245,.13),transparent 62%),
    radial-gradient(700px 400px at 100% 100%,rgba(91,124,255,.08),transparent 60%),
    linear-gradient(rgba(90,140,220,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(90,140,220,.055) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
html[data-ui="tech-dark"] *{scrollbar-width:thin;scrollbar-color:rgba(90,200,255,.3) transparent}
html[data-ui="tech-dark"] h1{font-family:var(--f-display);font-size:32px;letter-spacing:.14em;line-height:1.1;display:inline-block;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(56,214,245,.35))}
html[data-ui="tech-dark"] h1::after{content:"";display:inline-block;width:.45em;height:.1em;margin-left:.12em;background:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
html[data-ui="tech-dark"] .today{font-family:var(--f-mono);color:color-mix(in srgb,var(--accent) 55%,var(--muted));letter-spacing:.06em;white-space:pre}
html[data-ui="tech-dark"] .btn{background:rgba(56,214,245,.06);border:1px solid var(--line-strong);border-radius:var(--r);color:var(--fg);transition:border-color .15s,box-shadow .15s,color .15s}
html[data-ui="tech-dark"] .btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px -4px var(--accent)}
html[data-ui="tech-dark"] .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-fg);font-weight:700;box-shadow:0 0 18px -6px var(--accent)}
html[data-ui="tech-dark"] .btn.primary:hover{color:var(--accent-fg);box-shadow:0 0 24px -4px var(--accent)}
html[data-ui="tech-dark"] .btn.danger{color:var(--danger);border-color:rgba(255,92,108,.35)}
html[data-ui="tech-dark"] .btn.danger:hover{color:var(--danger);border-color:var(--danger);box-shadow:0 0 14px -4px var(--danger)}
html[data-ui="tech-dark"] .chip{background:color-mix(in srgb,var(--c) 8%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:var(--r);
  color:color-mix(in srgb,var(--c) 80%,#fff);box-shadow:0 0 12px -6px var(--c)}
html[data-ui="tech-dark"] .banner{background:rgba(56,214,245,.06);border:1px dashed var(--line-strong);border-radius:var(--r)}
html[data-ui="tech-dark"] .add{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);backdrop-filter:blur(8px);
  box-shadow:0 0 30px -20px var(--accent);transition:border-color .15s,box-shadow .15s}
html[data-ui="tech-dark"] .add:focus-within{border-color:var(--accent);box-shadow:0 0 26px -8px var(--accent)}
html[data-ui="tech-dark"] .add::before{content:">";font-family:var(--f-mono);font-weight:600;color:var(--accent);padding-left:4px;text-shadow:0 0 8px var(--accent)}
html[data-ui="tech-dark"] .date-in{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);color:var(--fg)}
html[data-ui="tech-dark"] .date-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 12px -4px var(--accent)}
html[data-ui="tech-dark"] .quick button{background:transparent;border:1px solid var(--line);border-radius:var(--r);color:var(--muted)}
html[data-ui="tech-dark"] .quick button:hover{border-color:var(--accent);color:var(--accent)}
html[data-ui="tech-dark"] .group{position:relative;border-radius:var(--r);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) calc(var(--tint) + 6%),transparent),color-mix(in srgb,var(--c) calc(var(--tint) - 6%),transparent)),var(--surface-solid);
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  box-shadow:0 0 30px -16px var(--c),inset 0 1px 0 color-mix(in srgb,var(--c) 35%,transparent)}
html[data-ui="tech-dark"] .group::before,html[data-ui="tech-dark"] .group::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--c);pointer-events:none;filter:drop-shadow(0 0 4px var(--c))}
html[data-ui="tech-dark"] .group::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
html[data-ui="tech-dark"] .group::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
html[data-ui="tech-dark"] .group.empty{background:color-mix(in srgb,var(--c) 6%,var(--surface-solid));box-shadow:none;opacity:.7}
html[data-ui="tech-dark"] .group.empty:hover{opacity:1}
html[data-ui="tech-dark"] .group.alert{animation:alertGlowD 2.4s ease-in-out infinite}
@keyframes alertGlowD{0%,100%{box-shadow:0 0 30px -16px var(--c),inset 0 1px 0 color-mix(in srgb,var(--c) 35%,transparent)}
  50%{box-shadow:0 0 38px -4px var(--c),inset 0 1px 0 color-mix(in srgb,var(--c) 60%,transparent)}}
html[data-ui="tech-dark"] .ghead h2{font-family:var(--f-display);letter-spacing:.1em;color:color-mix(in srgb,var(--c) 75%,#fff);text-shadow:0 0 10px color-mix(in srgb,var(--c) 60%,transparent)}
html[data-ui="tech-dark"] .ghead .range{font-family:var(--f-mono);font-size:11.5px;color:color-mix(in srgb,var(--c) 45%,var(--muted))}
html[data-ui="tech-dark"] .ghead .count{background:rgba(0,0,0,.35);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;color:color-mix(in srgb,var(--c) 85%,#fff)}
html[data-ui="tech-dark"] .ghead .hide{background:rgba(0,0,0,.3);border-color:color-mix(in srgb,var(--c) 30%,transparent);border-radius:var(--r)}
html[data-ui="tech-dark"] .ghead .hide:hover{color:var(--fg)}
html[data-ui="tech-dark"] .ghead .hide[aria-pressed="true"]{color:color-mix(in srgb,var(--c) 85%,#fff);border-color:var(--c);box-shadow:0 0 10px -4px var(--c)}
html[data-ui="tech-dark"] .task{background:rgba(6,11,19,.72);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);transition:border-color .15s,box-shadow .15s,opacity .2s}
html[data-ui="tech-dark"] .task:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 16px -8px var(--c)}
html[data-ui="tech-dark"] .task.done{opacity:.38}
html[data-ui="tech-dark"] .task.open{border-color:var(--accent);box-shadow:0 0 0 1px rgba(56,214,245,.2),0 0 26px -8px var(--accent)}
html[data-ui="tech-dark"] .ttl-text:hover{background:rgba(56,214,245,.1)}
html[data-ui="tech-dark"] .ttl-edit{background:rgba(0,0,0,.4);color:var(--fg);box-shadow:0 0 12px -4px var(--accent)}
html[data-ui="tech-dark"] .check{border-radius:3px;border-color:color-mix(in srgb,var(--c,var(--accent)) 60%,var(--faint));background:transparent}
html[data-ui="tech-dark"] .check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent)}
html[data-ui="tech-dark"] .pill{font-family:var(--f-mono);font-size:11.5px;border-radius:3px;background:color-mix(in srgb,var(--c) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 50%,transparent);color:color-mix(in srgb,var(--c) 85%,#fff);text-shadow:0 0 8px color-mix(in srgb,var(--c) 50%,transparent)}
html[data-ui="tech-dark"] .subs-mini li::before{content:"›";color:var(--c);font-weight:700}
html[data-ui="tech-dark"] .detail{border-top:1px dashed var(--line-strong)}
html[data-ui="tech-dark"] .field>label,html[data-ui="tech-dark"] .lbl{letter-spacing:.14em;color:color-mix(in srgb,var(--accent) 45%,var(--muted))}
html[data-ui="tech-dark"] .text-in,html[data-ui="tech-dark"] textarea{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:var(--r);color:var(--fg)}
html[data-ui="tech-dark"] .text-in:focus,html[data-ui="tech-dark"] textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 12px -4px var(--accent)}
html[data-ui="tech-dark"] .sub{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r)}
html[data-ui="tech-dark"] .mini:hover{background:rgba(56,214,245,.1);color:var(--accent)}
html[data-ui="tech-dark"] .mini.has{color:var(--accent)}
html[data-ui="tech-dark"] details.drawer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px)}
html[data-ui="tech-dark"] details.drawer>summary{font-family:var(--f-display);letter-spacing:.08em}
html[data-ui="tech-dark"] details.drawer>summary::before{border-color:var(--accent)}
html[data-ui="tech-dark"] details.drawer .count{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:3px}
html[data-ui="tech-dark"] .ditem{border-top-color:var(--line)}
html[data-ui="tech-dark"] dialog{background:var(--surface-solid);border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 0 60px -20px var(--accent)}
html[data-ui="tech-dark"] dialog::backdrop{background:rgba(2,6,12,.72);backdrop-filter:blur(3px)}
html[data-ui="tech-dark"] .dlg h3{font-family:var(--f-display);letter-spacing:.08em;color:var(--accent)}
html[data-ui="tech-dark"] .dlg footer{border-top-color:var(--line)}
html[data-ui="tech-dark"] .trow input[type=color]{background:var(--sunk);border-color:var(--line)}
html[data-ui="tech-dark"] .toast{background:var(--surface-solid);color:var(--fg);border:1px solid var(--accent);border-radius:var(--r);box-shadow:0 0 24px -6px var(--accent)}
html[data-ui="tech-dark"] .toast button{color:var(--accent)}
/* ===================== 介面切換鈕 ===================== */
.uiswitch{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-solid)}
.uiswitch button{font-size:12px;padding:6px 10px;color:var(--muted)}
.uiswitch button+button{border-left:1px solid var(--line)}
.uiswitch button:hover{color:var(--fg)}
.uiswitch button[aria-pressed="true"]{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:var(--accent-fg);font-weight:600}
.tools{flex-wrap:wrap;align-items:center}
/* ===================== ToDo 標題動畫（由 JS 輪流隨機播放） ===================== */
h1 .hop{display:inline-block;position:relative;z-index:20;transform-origin:50% 100%;will-change:transform}
/* 科技版：漸層改成逐字上色，跳動時字才不會消失 */
html[data-ui^="tech"] h1{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--accent)}
html[data-ui^="tech"] h1 .hop{color:color-mix(in srgb,var(--accent-2) calc(var(--i) * 33%),var(--accent))}
h1{padding-top:.25em}
/* ===================== 登入畫面、載入中、同步狀態 ===================== */
.login{min-height:calc(100vh - 100px);display:grid;place-items:center;padding-block:40px}
.login-card{width:min(360px,100%);box-sizing:border-box;background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 40px -24px var(--accent)}
.login-card h2{margin:0;font-size:20px;font-family:var(--f-display);letter-spacing:.06em}
.login-card .hint{margin:0 0 6px;font-size:13px}
.login-card label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.login-card input{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:9px 10px;color:var(--fg)}
.login-card input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 10px -4px var(--accent)}
.login-card .btn{margin-top:8px;padding:9px}
.login-card .btn:disabled{opacity:.6;cursor:wait}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="ok"]::before{background:#3E9B6B}
.sync[data-s="saving"]::before{background:#E0A526}
.sync[data-s="error"]::before{background:var(--danger)}
.banner.error{border-color:color-mix(in srgb,var(--danger) 50%,var(--line));background:color-mix(in srgb,var(--danger) 7%,var(--surface-solid))}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="login" id="login" hidden>
  <form class="login-card" id="loginform" autocomplete="on">
    <h2>登入 ToDo</h2>
    <p class="hint">使用在 Supabase 後台建立的帳號登入。</p>
    <label for="li-email">帳號（Email）</label>
    <input id="li-email" type="email" autocomplete="username" required>
    <label for="li-pw">密碼</label>
    <input id="li-pw" type="password" autocomplete="current-password" required>
    <p class="err" id="li-err" hidden></p>
    <button class="btn primary" type="submit" id="li-btn">登入</button>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1 aria-label="ToDo"><span class="logo" aria-hidden="true"><span class="hop" style="--i:0;--tilt:-8deg">T</span><span class="hop" style="--i:1;--tilt:8deg">o</span><span class="hop" style="--i:2;--tilt:-8deg">D</span><span class="hop" style="--i:3;--tilt:8deg">o</span></span></h1>
      <div class="today mono" id="today"></div>
      <div class="sync" id="sync" data-s="ok" role="status">已同步</div>
    </div>
    <div class="tools">
      <div class="uiswitch" id="uiswitch" role="group" aria-label="介面風格">
        <button type="button" data-ui-set="classic">經典</button><button type="button" data-ui-set="tech-light">科技・亮</button><button type="button" data-ui-set="tech-dark">科技・暗</button>
      </div>
      <button class="btn" id="btn-backup" type="button">備份</button>
      <button class="btn" id="btn-settings" type="button">層級設定</button>
      <button class="btn" id="btn-logout" type="button">登出</button>
    </div>
  </header>
  <div class="summary" id="summary"></div>
  <div id="banner"></div>

  <form class="add" id="addform" autocomplete="off">
    <input type="text" id="add-title" placeholder="新增待辦事項，按 Enter 送出" aria-label="待辦事項標題">
    <input type="date" class="date-in" id="add-due" aria-label="到期日">
    <div class="quick" id="quick">
      <button type="button" data-q="0">今天</button><button type="button" data-q="1">明天</button>
      <button type="button" data-q="3">+3天</button><button type="button" data-q="7">+7天</button>
      <button type="button" data-q="">無期限</button>
    </div>
    <button class="btn primary" type="submit">新增</button>
  </form>

  <main id="groups" class="groups"></main>

  <details class="drawer" id="done-drawer">
    <summary>已完成 <span class="count" id="done-count">0</span></summary>
    <div class="dlist" id="done-list"></div>
  </details>
  <details class="drawer" id="trash-drawer">
    <summary>垃圾桶 <span class="count" id="trash-count">0</span><button class="btn danger sact" type="button" data-act="emptyTrash" id="btn-empty">清空</button></summary>
    <div class="dlist" id="trash-list"></div>
  </details>
</div>

<dialog id="dlg-settings"><div class="dlg">
  <header><h3>層級設定</h3></header>
  <div class="body">
    <p class="hint">每個層級設定「剩餘天數上限」，系統由上往下比對，落在第一個符合的層級。負數代表逾期，0 代表今天到期。最後一列收納其餘所有天數，以及沒有設定到期日的事項。</p>
    <div class="tier-table" id="tier-table"></div>
    <div><button class="btn" type="button" id="tier-add">新增層級</button></div>
    <div class="field"><span class="lbl">母任務依哪個日期分組</span>
      <div class="radio">
        <label><input type="radio" name="groupBy" value="earliest" id="gb-earliest"> <span>最急的日期（母任務與未完成子任務中最早的那個）</span></label>
        <label><input type="radio" name="groupBy" value="self" id="gb-self"> <span>只看母任務自己的到期日</span></label>
      </div>
    </div>
    <p class="err" id="tier-err" hidden></p>
  </div>
  <footer>
    <button class="btn" type="button" id="tier-reset" style="margin-right:auto">恢復預設</button>
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn primary" type="button" id="tier-save">儲存</button>
  </footer>
</div></dialog>

<dialog id="dlg-backup"><div class="dlg">
  <header><h3>備份與還原</h3></header>
  <div class="body">
    <p class="hint">資料存放在雲端資料庫。這裡可以另外下載一份備份檔留存，或把舊版（本機版）的備份匯入雲端。</p>
    <div class="frow">
      <button class="btn primary" type="button" id="bk-download">下載備份檔 (.json)</button>
      <button class="btn" type="button" id="bk-copy">複製備份內容</button>
    </div>
    <div class="field"><label for="bk-import-text">匯入：選擇備份檔，或貼上備份內容（只匯入待辦事項，會新增到雲端，不會刪除現有資料）</label>
      <input type="file" id="bk-file" accept=".json,application/json">
      <textarea id="bk-import-text" rows="4" placeholder="貼上備份內容"></textarea>
    </div>
    <p class="hint" id="bk-msg"></p>
  </div>
  <footer>
    <button class="btn" type="button" data-close>關閉</button>
    <button class="btn primary" type="button" id="bk-import">匯入到雲端</button>
  </footer>
</div></dialog>

<div class="toast" id="toast" hidden><span id="toast-msg"></span><button type="button" id="toast-undo">復原</button></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
(()=>{
try{const u=localStorage.getItem('todo-ui');if(u)document.documentElement.dataset.ui=u}catch(e){}
const DAY=86400000, WD='日一二三四五六';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const daysLeft=s=>{if(!s)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((parse(s)-t)/DAY)};
const shortDate=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+' ('+WD[d.getDay()]+')'};
const dayText=d=>d==null?'無期限':d<0?`逾期 ${-d} 天`:d===0?'今天':d===1?'明天':`剩 ${d} 天`;

/* ---------- 資料：全部來自雲端（透過 api.js），畫面只保留目前這一份在記憶體 ---------- */
const API=window.TodoAPI;
const emptySettings=()=>({tiers:[],groupBy:'earliest',ui:null,userId:null});
let state={tasks:[],settings:emptySettings(),loaded:false};
const ui={open:new Set(),subNote:new Set(),doneOpen:new Set(),lastDay:todayStr()};

/* 同步狀態燈號 */
function setSync(s){const el=$('#sync');el.dataset.s=s;el.textContent={ok:'已同步',saving:'儲存中…',error:'連線異常'}[s]}

/* 寫入雲端：依序送出（避免先後順序錯亂），失敗時提示並重新載入雲端資料 */
let writeQueue=Promise.resolve(), pendingWrites=0, failNotified=false;
function persist(fn,failMsg='儲存失敗'){
  pendingWrites++;setSync('saving');
  const p=writeQueue.then(fn);
  writeQueue=p.catch(()=>{});
  return p.then(()=>true,e=>{handleWriteError(e,failMsg);return false})
    .finally(()=>{pendingWrites--;if(!pendingWrites&&$('#sync').dataset.s==='saving')setSync('ok')});
}
function handleWriteError(e,prefix){
  if(e&&e.needsLogin){showLogin(e.message);return}
  setSync('error');
  if(!failNotified){failNotified=true;toast(`${prefix}：${e.message||e} 已重新載入雲端資料。`)}
  writeQueue.then(()=>reload()).finally(()=>{failNotified=false});
}

/* 備註輸入中：停止打字 0.7 秒後才送出，離開欄位時立即送出 */
const typingWrites=new Map();
function debounceWrite(key,fn,ms=700){const x=typingWrites.get(key);if(x)clearTimeout(x.t);
  typingWrites.set(key,{fn,t:setTimeout(()=>{typingWrites.delete(key);persist(fn)},ms)})}
function flushWrite(key){const x=typingWrites.get(key);if(x){clearTimeout(x.t);typingWrites.delete(key);persist(x.fn)}}
function flushAllWrites(){[...typingWrites.keys()].forEach(flushWrite)}

/* 從雲端重新載入全部資料 */
let loading=null;
function reload(){
  if(loading)return loading;
  loading=(async()=>{
    try{
      const d=await API.loadAll();
      state.tasks=d.tasks;state.settings=d.settings;state.loaded=true;
      $('#banner').innerHTML='';applyUI();render();setSync('ok');
    }catch(e){
      if(e.needsLogin){showLogin(e.message);return}
      setSync('error');
      if(!state.loaded)$('#banner').innerHTML=`<div class="banner error"><span>無法載入資料：${esc(e.message)}</span><button class="btn primary" type="button" data-act="retry">重試</button></div>`;
      else toast('無法更新資料：'+e.message);
    }finally{loading=null}
  })();
  return loading;
}

/* 登入／登出畫面切換 */
function showLogin(msg){
  state={tasks:[],settings:emptySettings(),loaded:false};
  render(); // 清掉畫面上的資料
  $('#app').hidden=true;$('#login').hidden=false;
  const err=$('#li-err');err.hidden=!msg;err.textContent=msg||'';
  try{$('#li-email').value=$('#li-email').value||localStorage.getItem('todo-last-email')||''}catch(e){}
  ($('#li-email').value?$('#li-pw'):$('#li-email')).focus();
}
function showApp(){$('#login').hidden=true;$('#app').hidden=false;render()}
$('#loginform').addEventListener('submit',async e=>{
  e.preventDefault();const btn=$('#li-btn'),err=$('#li-err');const email=$('#li-email').value.trim();
  err.hidden=true;btn.disabled=true;btn.textContent='登入中…';
  try{await API.signIn(email,$('#li-pw').value);$('#li-pw').value='';try{localStorage.setItem('todo-last-email',email)}catch(x){}
    showApp();await reload()}
  catch(x){err.textContent=x.message;err.hidden=false}
  finally{btn.disabled=false;btn.textContent='登入'}
});
$('#btn-logout').addEventListener('click',async()=>{flushAllWrites();await writeQueue;await API.signOut();ui.open.clear();ui.doneOpen.clear();showLogin()});

/* ---------- tiers ---------- */
const sortedTiers=(tiers=state.settings.tiers)=>[...tiers].sort((a,b)=>(a.max==null?1e9:a.max)-(b.max==null?1e9:b.max));
function tierFor(d){if(d==null)return sortedTiers().at(-1);for(const t of sortedTiers())if(t.max==null||d<=t.max)return t;return sortedTiers().at(-1)}
const colorFor=d=>tierFor(d).color;
function rangeText(tiers,idx){
  const st=sortedTiers(tiers),t=st[idx],prev=idx>0?st[idx-1].max:null;
  const lo=idx===0?-Infinity:prev+1, hi=t.max==null?Infinity:t.max;
  const f=n=>n<0?`逾期 ${-n} 天`:n===0?'今天':`${n} 天`;
  if(lo===-Infinity&&hi===Infinity)return '全部';
  if(lo===-Infinity)return hi<0?(hi===-1?'已過到期日':`逾期 ${-hi} 天以上`):hi===0?'今天及逾期':`剩 ${hi} 天以內（含逾期）`;
  if(hi===Infinity)return lo<=0?`${f(lo)}以後`:`剩 ${lo} 天以上`;
  if(lo===hi)return lo===0?'今天到期':lo<0?`逾期 ${-lo} 天`:`剩 ${lo} 天`;
  if(lo>=0)return `剩 ${lo}–${hi} 天`;
  return `${f(lo)} 至 ${f(hi)}`;
}
function groupDate(t){
  if(state.settings.groupBy==='self')return t.due||null;
  const ds=[t.due,...t.subs.filter(s=>!s.done).map(s=>s.due)].filter(Boolean).sort();
  return ds[0]||null;
}

/* ---------- render ---------- */
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
function pill(due){const d=daysLeft(due);return `<span class="pill" style="--c:${colorFor(d)}">${dayText(d)}</span>`}

function taskHTML(t){
  const open=ui.open.has(t.id), d=daysLeft(t.due);
  const doneSubs=t.subs.filter(s=>s.done).length;
  const meta=[];
  if(t.subs.length)meta.push(`子任務 ${doneSubs}/${t.subs.length}`);
  if(t.note)meta.push('有備註');
  let h=`<article class="task${t.done?' done':''}${open?' open':''}" data-id="${t.id}">
  <div class="row" data-act="expand" role="button" tabindex="0" aria-expanded="${open}" title="點一下展開／收合">
    <button class="check" type="button" data-act="toggle" aria-pressed="${t.done}" aria-label="標記完成">${CHECK}</button>
    <div class="ttl"><span class="ttl-text" data-edit title="點兩下編輯標題">${esc(t.title)}</span>${meta.length?`<span class="ttl-meta">${meta.join(' · ')}</span>`:''}</div>
    <span class="due"><span class="pill" style="--c:${colorFor(d)}">${dayText(d)}</span>${t.due?`<span class="dstr mono">${shortDate(t.due)}</span>`:''}</span>
  </div>`;
  if(!open){
    const pending=t.subs.filter(s=>!s.done);
    if(pending.length&&!t.done)h+=`<ul class="subs-mini" data-act="expand">${pending.map(s=>`<li><span class="t">${esc(s.title)}</span>${s.due?pill(s.due):''}</li>`).join('')}</ul>`;
  }else{
    h+=`<div class="detail">
      <div class="frow">
        <div class="field"><label for="td-${t.id}">到期日</label><input type="date" class="date-in" id="td-${t.id}" data-f="due" value="${t.due||''}"></div>
      </div>
      <div class="field"><label for="tn-${t.id}">備註</label><textarea id="tn-${t.id}" data-f="note" placeholder="可留空">${esc(t.note)}</textarea></div>
      <div class="field"><span class="lbl">子任務</span>
        <div class="sublist">${t.subs.map(s=>subHTML(t,s)).join('')||'<div class="empty-note">還沒有子任務</div>'}</div>
      </div>
      <div class="addsub">
        <input class="text-in" id="as-${t.id}" placeholder="新增子任務，按 Enter 送出" data-addsub>
        <input type="date" class="date-in" id="asd-${t.id}" aria-label="子任務到期日">
        <button class="btn" type="button" data-act="addSub">新增子任務</button>
      </div>
      <div class="dfoot"><button class="btn danger" type="button" data-act="trash">移到垃圾桶</button><button class="btn" type="button" data-act="expand">收合</button></div>
    </div>`;
  }
  return h+'</article>';
}
function subHTML(t,s){
  const noteOpen=ui.subNote.has(s.id);
  return `<div class="sub${s.done?' done':''}" data-sid="${s.id}">
    <div class="subrow">
      <button class="check" type="button" data-act="toggleSub" aria-pressed="${s.done}" aria-label="子任務完成">${CHECK}</button>
      <input class="sub-title" id="st-${s.id}" data-sf="title" value="${esc(s.title)}" aria-label="子任務標題">
      <input type="date" class="date-in" id="sd-${s.id}" data-sf="due" value="${s.due||''}" aria-label="子任務到期日">
      ${pill(s.due)}
      <button class="mini${s.note?' has':''}" type="button" data-act="subNote" aria-expanded="${noteOpen}">備註${s.note?' •':''}</button>
      <button class="mini" type="button" data-act="delSub" aria-label="刪除子任務">刪除</button>
    </div>
    ${noteOpen?`<textarea id="sn-${s.id}" data-sf="note" placeholder="子任務備註">${esc(s.note)}</textarea>`:''}
  </div>`;
}

/* 已完成區的一筆：可展開查看備註與子任務（唯讀） */
function doneItemHTML(t){
  const open=ui.doneOpen.has(t.id), canOpen=t.subs.length||t.note;
  const doneSubs=t.subs.filter(s=>s.done).length;
  let h=`<div class="ditem${open?' open':''}" data-id="${t.id}">
    ${canOpen?`<button class="dexp" type="button" data-act="doneExpand" aria-expanded="${open}"><span class="caret" aria-hidden="true"></span><span class="t">${esc(t.title)}${t.subs.length?`（子任務 ${doneSubs}/${t.subs.length}）`:''}</span></button>`
      :`<span class="t">${esc(t.title)}</span>`}
    <span class="when mono">${t.doneAt?'完成於 '+shortDate(ymd(new Date(t.doneAt))):''}</span>
    <button class="mini" type="button" data-act="undone">取消完成</button><button class="mini" type="button" data-act="trash">丟到垃圾桶</button>`;
  if(open){
    h+=`<div class="ddetail">`;
    if(t.note)h+=`<div class="dnote"><span class="lbl">備註</span><p>${esc(t.note)}</p></div>`;
    if(t.subs.length)h+=`<ul class="dsubs">${t.subs.map(s=>`<li class="${s.done?'done':''}" style="--c:${colorFor(daysLeft(s.due))}">
      <span class="dcheck" aria-label="${s.done?'已完成':'未完成'}">${s.done?CHECK:''}</span>
      <span class="st">${esc(s.title)}</span>${s.due?`<span class="dstr mono">${shortDate(s.due)}</span>`:''}
      ${s.note?`<p class="snote">${esc(s.note)}</p>`:''}</li>`).join('')}</ul>`;
    h+=`<p class="hint">要修改內容，請先按「取消完成」讓它回到清單。</p></div>`;
  }
  return h+'</div>';
}

function render(){
  const ae=document.activeElement, focusId=ae&&ae.id, sel=ae&&'selectionStart' in ae?[ae.selectionStart,ae.selectionEnd]:null;
  tick();
  if(!state.loaded||!state.settings.tiers.length){
    $('#groups').innerHTML='<div class="loading">正在從雲端載入…</div>';$('#summary').innerHTML='';
    $('#done-list').innerHTML='';$('#trash-list').innerHTML='';$('#done-count').textContent='0';$('#trash-count').textContent='0';$('#btn-empty').hidden=true;
    return;
  }
  const live=state.tasks.filter(t=>!t.trashed);
  const tiers=sortedTiers();
  const buckets=new Map(tiers.map(t=>[t.id,[]])), doneArea=[];
  for(const t of live){const tier=tierFor(daysLeft(groupDate(t)));
    if(t.done&&tier.hideDone)doneArea.push(t);else buckets.get(tier.id).push(t);}
  const byDate=(a,b)=>(a.done-b.done)||((groupDate(a)||'9999')<(groupDate(b)||'9999')?-1:(groupDate(a)||'9999')>(groupDate(b)||'9999')?1:a.created-b.created);
  const st=sortedTiers();
  $('#groups').innerHTML=tiers.map(tier=>{
    const items=buckets.get(tier.id).sort(byDate), idx=st.indexOf(tier);
    const range=rangeText(state.settings.tiers,idx)+(tier.max==null?'，含無期限':'');
    const undone=items.filter(t=>!t.done).length;
    return `<section class="group${items.length?'':' empty'}${tier.max!=null&&tier.max<0&&undone?' alert':''}" style="--c:${tier.color}" data-tier="${tier.id}">
      <div class="ghead"><h2>${esc(tier.name)}</h2><span class="range">${esc(range)}</span><span class="count">${undone}</span>
      <button class="hide" type="button" data-act="hideToggle" aria-pressed="${tier.hideDone}" title="切換：完成的項目要留在這組，還是移到已完成區">${tier.hideDone?'完成後移到已完成':'完成後留在清單'}</button></div>
      ${items.length?`<div class="list">${items.map(taskHTML).join('')}</div>`:''}
    </section>`}).join('');

  // summary chips (undone only)
  $('#summary').innerHTML=tiers.map(tier=>{const n=buckets.get(tier.id).filter(t=>!t.done).length;return n?`<span class="chip" style="--c:${tier.color}">${esc(tier.name)} <b>${n}</b></span>`:''}).join('')
    ||'<span class="chip" style="--c:#4E9A78">目前沒有未完成的事項</span>';

  doneArea.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  $('#done-count').textContent=doneArea.length;
  $('#done-list').innerHTML=doneArea.length?doneArea.map(doneItemHTML).join('')
    :'<div class="empty-note">設定為「完成後移到已完成」的組別，勾選完成的事項會集中在這裡。</div>';
  const trash=state.tasks.filter(t=>t.trashed).sort((a,b)=>b.trashedAt-a.trashedAt);
  $('#trash-count').textContent=trash.length;
  $('#btn-empty').hidden=!trash.length;
  $('#trash-list').innerHTML=trash.length?trash.map(t=>`<div class="ditem" data-id="${t.id}"><span class="t">${esc(t.title)}</span><button class="mini" type="button" data-act="restore">還原</button><button class="mini" type="button" data-act="purge" style="color:var(--danger)">永久刪除</button></div>`).join('')
    :'<div class="empty-note">垃圾桶是空的。</div>';

  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();if(sel&&'setSelectionRange' in el){try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}}
  updateBadge();
}

function updateBadge(){
  const n=state.tasks.filter(t=>!t.trashed&&!t.done&&(d=>d!=null&&d<=0)(daysLeft(groupDate(t)))).length;
  document.title=n?`(${n}) ToDo`:'ToDo';
  try{if('setAppBadge' in navigator){n?navigator.setAppBadge(n).catch(()=>{}):navigator.clearAppBadge().catch(()=>{})}}catch(e){}
}

/* ---------- toast ---------- */
let toastTimer=null,undoFn=null;
function toast(msg,undo){$('#toast-msg').textContent=msg;undoFn=undo||null;$('#toast-undo').hidden=!undo;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('#toast').hidden=true;undoFn=null},4500)}
$('#toast-undo').addEventListener('click',()=>{if(undoFn)undoFn();$('#toast').hidden=true;undoFn=null});

/* ---------- actions：先更新畫面，再送到雲端 ---------- */
const findT=id=>state.tasks.find(t=>t.id===id);
function setDone(id,v){const t=findT(id);if(!t)return;t.done=v;t.doneAt=v?Date.now():null;if(!v)ui.doneOpen.delete(id);render();
  persist(()=>API.updateTask(id,{done:t.done,doneAt:t.doneAt}))}
function setTrashed(id,v){const t=findT(id);if(!t)return;t.trashed=v;t.trashedAt=v?Date.now():null;if(v){ui.open.delete(id);ui.doneOpen.delete(id)}render();
  persist(()=>API.updateTask(id,{trashed:t.trashed,trashedAt:t.trashedAt}))}
function putBack(tasks){ // 復原永久刪除：把整筆（含子任務）重新寫回雲端
  for(const t of tasks)if(!findT(t.id))state.tasks.push(t);render();
  persist(async()=>{for(const t of tasks)await API.createTask(t)},'復原失敗')}
function patchTask(t,patch){Object.assign(t,patch);render();persist(()=>API.updateTask(t.id,patch))}
function patchSub(s,patch){Object.assign(s,patch);render();persist(()=>API.updateSub(s.id,patch))}
const actions={
  toggle(t){const was=t.done;setDone(t.id,!was);
    if(!was&&tierFor(daysLeft(groupDate(t))).hideDone)toast(`「${t.title}」已移到已完成區`,()=>setDone(t.id,was))},
  expand(t){ui.open.has(t.id)?ui.open.delete(t.id):ui.open.add(t.id);render()},
  toggleSub(t,s){const v=!s.done;patchSub(s,{done:v,doneAt:v?Date.now():null})},
  subNote(t,s){ui.subNote.has(s.id)?ui.subNote.delete(s.id):ui.subNote.add(s.id);render();if(ui.subNote.has(s.id))document.getElementById('sn-'+s.id)?.focus()},
  delSub(t,s){const idx=t.subs.indexOf(s);t.subs.splice(idx,1);render();persist(()=>API.deleteSub(s.id));
    toast('已刪除子任務',()=>{const cur=findT(t.id);if(!cur)return;cur.subs.splice(Math.min(idx,cur.subs.length),0,s);render();persist(()=>API.createSub(cur.id,s),'復原失敗')})},
  addSub(t){const ti=document.getElementById('as-'+t.id),di=document.getElementById('asd-'+t.id);const v=ti.value.trim();if(!v){ti.focus();return}
    const s={id:API.newId(),title:v,due:di.value||null,note:'',done:false,doneAt:null,sortOrder:Math.max(0,...t.subs.map(x=>x.sortOrder||0))+1};
    t.subs.push(s);render();document.getElementById('as-'+t.id)?.focus();persist(()=>API.createSub(t.id,s))},
  trash(t){setTrashed(t.id,true);toast(`已把「${t.title}」丟到垃圾桶`,()=>setTrashed(t.id,false))},
  undone(t){setDone(t.id,false)},
  doneExpand(t){ui.doneOpen.has(t.id)?ui.doneOpen.delete(t.id):ui.doneOpen.add(t.id);render()},
  restore(t){setTrashed(t.id,false)},
  purge(t){state.tasks=state.tasks.filter(x=>x!==t);render();persist(()=>API.deleteTasks([t.id]),'刪除失敗');toast('已永久刪除',()=>putBack([t]))},
};
document.addEventListener('click',e=>{
  if(e.target.closest('[data-edit],.ttl-edit'))return; // 標題本身：單擊不展開，雙擊才編輯
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='retry'){$('#banner').innerHTML='';reload();return}
  if(act==='hideToggle'){const id=b.closest('[data-tier]').dataset.tier;const tier=state.settings.tiers.find(t=>t.id===id);if(!tier)return;
    tier.hideDone=!tier.hideDone;render();persist(()=>API.updateTier(id,{hideDone:tier.hideDone}));return}
  if(act==='emptyTrash'){e.preventDefault();const gone=state.tasks.filter(t=>t.trashed);if(!gone.length)return;
    state.tasks=state.tasks.filter(t=>!t.trashed);render();persist(()=>API.deleteTasks(gone.map(t=>t.id)),'刪除失敗');
    toast(`已永久刪除 ${gone.length} 筆`,()=>putBack(gone));return}
  const host=b.closest('[data-id]');if(!host)return;const t=findT(host.dataset.id);if(!t)return;
  const sh=b.closest('[data-sid]');const s=sh?t.subs.find(x=>x.id===sh.dataset.sid):null;
  actions[act]?.(t,s);
});
// 欄位修改：離開欄位（change）時送出
document.addEventListener('change',e=>{
  const el=e.target,host=el.closest('[data-id]');if(!host)return;const t=findT(host.dataset.id);if(!t)return;
  if(el.dataset.f){const f=el.dataset.f;
    if(f==='title'){const v=el.value.trim();if(!v){el.value=t.title;return}if(v!==t.title)patchTask(t,{title:v})}
    else if(f==='due'){const v=el.value||null;if(v!==t.due)patchTask(t,{due:v})}
    else flushWrite('tn-'+t.id)}
  else if(el.dataset.sf){const s=t.subs.find(x=>x.id===el.closest('[data-sid]').dataset.sid);if(!s)return;const f=el.dataset.sf;
    if(f==='title'){const v=el.value.trim();if(!v){el.value=s.title;return}if(v!==s.title)patchSub(s,{title:v})}
    else if(f==='due'){const v=el.value||null;if(v!==s.due)patchSub(s,{due:v})}
    else flushWrite('sn-'+s.id)}
});
document.addEventListener('input',e=>{ // 備註：打字時先記在畫面，停頓後送出
  const el=e.target;if(el.tagName!=='TEXTAREA')return;const host=el.closest('[data-id]');if(!host)return;const t=findT(host.dataset.id);if(!t)return;
  if(el.dataset.f==='note'){t.note=el.value;debounceWrite('tn-'+t.id,()=>API.updateTask(t.id,{note:t.note}))}
  else if(el.dataset.sf==='note'){const s=t.subs.find(x=>x.id===el.closest('[data-sid]').dataset.sid);if(!s)return;s.note=el.value;
    debounceWrite('sn-'+s.id,()=>API.updateSub(s.id,{note:s.note}))}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('[data-addsub]')){e.preventDefault();const t=findT(e.target.closest('[data-id]').dataset.id);actions.addSub(t)}
  if(e.key==='Enter'&&e.target.matches('.sub-title,.text-in[data-f="title"]')){e.target.blur()}
});

/* inline title edit: double-click the title text */
function editTitle(span){
  const host=span.closest('[data-id]');const t=findT(host.dataset.id);if(!t)return;
  const inp=document.createElement('input');inp.className='ttl-edit';inp.value=t.title;inp.setAttribute('aria-label','編輯標題');
  span.replaceWith(inp);inp.focus();inp.select();
  let finished=false;
  const finish=commit=>{if(finished)return;finished=true;const v=inp.value.trim();
    if(commit&&v&&v!==t.title)patchTask(t,{title:v});else render()};
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();finish(true)}else if(e.key==='Escape'){e.preventDefault();finish(false)}});
  inp.addEventListener('blur',()=>finish(true));
}
document.addEventListener('dblclick',e=>{const span=e.target.closest('[data-edit]');if(!span)return;e.preventDefault();editTitle(span)});
document.addEventListener('keydown',e=>{ // 鍵盤：在任務列上按 Enter 展開、F2 編輯標題
  const row=e.target.closest&&e.target.closest('.row[data-act=expand]');if(!row||e.target!==row)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click()}
  else if(e.key==='F2'){e.preventDefault();const sp=row.querySelector('[data-edit]');if(sp)editTitle(sp)}
});

/* quick add */
$('#quick').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;$('#add-due').value=b.dataset.q===''?'':addDays(+b.dataset.q);$('#add-title').focus()});
$('#addform').addEventListener('submit',e=>{e.preventDefault();const v=$('#add-title').value.trim();if(!v){$('#add-title').focus();return}
  if(!state.loaded)return;
  const t={id:API.newId(),title:v,due:$('#add-due').value||null,note:'',done:false,doneAt:null,created:Date.now(),trashed:false,trashedAt:null,subs:[]};
  state.tasks.push(t);$('#add-title').value='';render();$('#add-title').focus();persist(()=>API.createTask(t),'新增失敗')});

/* drawers keep their open state across renders natively (they are outside #groups) */

/* ---------- settings dialog ---------- */
let draft=null;
const dlgS=$('#dlg-settings');
function drawTiers(){
  const st=sortedTiers(draft.tiers);
  $('#tier-table').innerHTML=`<div class="trow head"><span>顏色</span><span>名稱</span><span>天數上限</span><span class="rng">涵蓋範圍</span><span></span></div>`+
  st.map((t,i)=>`<div class="trow" data-tid="${t.id}">
    <input type="color" id="tc-${t.id}" value="${t.color}" data-k="color" aria-label="顏色">
    <input class="text-in" id="tn-${t.id}" value="${esc(t.name)}" data-k="name" aria-label="名稱">
    <span class="num">${t.max==null?'其餘全部（含無期限）':`<span>≤</span><input class="text-in" type="number" step="1" id="tm-${t.id}" value="${t.max}" data-k="max" aria-label="天數上限"><span>天</span>`}</span>
    <span class="rng">${esc(rangeText(draft.tiers,i))}</span>
    ${t.max==null?'<span></span>':`<button class="x" type="button" data-del="${t.id}" aria-label="刪除層級">×</button>`}
  </div>`).join('');
  $('#gb-'+draft.groupBy).checked=true;
}
const draftTier=id=>draft.tiers.find(t=>t.id===id);
$('#tier-table').addEventListener('input',e=>{const el=e.target,row=el.closest('[data-tid]');if(!row)return;const t=draftTier(row.dataset.tid);
  if(el.dataset.k==='color')t.color=el.value;if(el.dataset.k==='name')t.name=el.value;});
$('#tier-table').addEventListener('change',e=>{const el=e.target;if(el.dataset.k!=='max')return;const t=draftTier(el.closest('[data-tid]').dataset.tid);
  const v=parseInt(el.value,10);if(Number.isFinite(v))t.max=v;drawTiers();document.getElementById('tm-'+t.id)?.focus()});
$('#tier-table').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;draft.tiers=draft.tiers.filter(t=>t.id!==b.dataset.del);drawTiers()});
$('#tier-add').addEventListener('click',()=>{const fin=draft.tiers.filter(t=>t.max!=null).map(t=>t.max);const m=(fin.length?Math.max(...fin):0)+7;
  const pal=['#7A5CC2','#2E8FB8','#B5527F','#5C7A2E','#C2703A'];draft.tiers.push({id:API.newId(),name:'新層級',max:m,color:pal[draft.tiers.length%pal.length],hideDone:false});drawTiers()});
$('#tier-reset').addEventListener('click',()=>{draft.tiers=API.defaultTiers();draft.groupBy='earliest';drawTiers();$('#tier-err').hidden=true});
$('#tier-save').addEventListener('click',()=>{
  draft.groupBy=document.querySelector('input[name=groupBy]:checked')?.value||'earliest';
  const err=$('#tier-err');const maxes=draft.tiers.filter(t=>t.max!=null).map(t=>t.max);
  if(draft.tiers.some(t=>!t.name.trim())){err.textContent='每個層級都需要名稱。';err.hidden=false;return}
  if(new Set(maxes).size!==maxes.length){err.textContent='有兩個層級的天數上限相同，請改成不同數字。';err.hidden=false;return}
  err.hidden=true;
  const prev=state.settings.tiers, next=draft.tiers.map(t=>({...t,name:t.name.trim()})), groupBy=draft.groupBy;
  state.settings.tiers=next;state.settings.groupBy=groupBy;draft=null;render();dlgS.close();
  persist(async()=>{await API.saveTiers(next,prev);await API.updateSettings(state.settings.userId,{groupBy})},'層級設定儲存失敗')
    .then(ok=>{if(ok)toast('層級設定已儲存')})});
$('#btn-settings').addEventListener('click',()=>{if(!state.loaded)return;draft=JSON.parse(JSON.stringify({tiers:state.settings.tiers,groupBy:state.settings.groupBy}));$('#tier-err').hidden=true;drawTiers();dlgS.showModal()});

/* ---------- backup dialog ---------- */
const dlgB=$('#dlg-backup');
const backupJSON=()=>JSON.stringify({app:'todo-board',version:2,exportedAt:new Date().toISOString(),
  tasks:state.tasks,settings:{tiers:state.settings.tiers,groupBy:state.settings.groupBy,ui:state.settings.ui}},null,2);
$('#btn-backup').addEventListener('click',()=>{$('#bk-msg').textContent='';$('#bk-import-text').value='';$('#bk-file').value='';dlgB.showModal()});
$('#bk-download').addEventListener('click',()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));
  a.download=`待辦備份-${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();$('#bk-msg').textContent='已下載備份檔。若沒有出現下載，請改用「複製備份內容」。'}catch(e){$('#bk-msg').textContent='這個環境無法下載檔案，請改用「複製備份內容」。'}});
$('#bk-copy').addEventListener('click',()=>{const txt=backupJSON();navigator.clipboard?.writeText(txt).then(()=>{$('#bk-msg').textContent='已複製，可以貼到記事本存檔。'})
  .catch(()=>{const ta=$('#bk-import-text');ta.value=txt;ta.select();$('#bk-msg').textContent='無法自動複製，內容已放進下方欄位並選取，請按 Ctrl+C。'})});
$('#bk-file').addEventListener('change',async e=>{const f=e.target.files[0];if(f)$('#bk-import-text').value=await f.text()});
$('#bk-import').addEventListener('click',()=>{
  let list;
  try{const o=JSON.parse($('#bk-import-text').value);list=(o.state||o).tasks;if(!Array.isArray(list))throw 0}
  catch(e){$('#bk-msg').textContent='讀不懂這份內容。請確認是從這個程式下載或複製的備份。';return}
  // 匯入一律產生新的編號，新增到雲端，不覆蓋現有資料；舊版的範例資料略過
  const now=Date.now();
  const tasks=list.filter(t=>t&&t.title&&!t.sample).map((t,i)=>({id:API.newId(),title:String(t.title),due:t.due||null,note:t.note||'',
    done:!!t.done,doneAt:t.done?(t.doneAt||now):null,trashed:!!t.trashed,trashedAt:t.trashed?(t.trashedAt||now):null,created:t.created||now+i,
    subs:(t.subs||[]).filter(s=>s&&s.title).map((s,j)=>({id:API.newId(),title:String(s.title),due:s.due||null,note:s.note||'',done:!!s.done,doneAt:s.done?(s.doneAt||now):null,sortOrder:j+1}))}));
  if(!tasks.length){$('#bk-msg').textContent='這份備份裡沒有可以匯入的待辦事項。';return}
  dlgB.close();state.tasks.push(...tasks);render();
  persist(async()=>{for(const t of tasks)await API.createTask(t)},'匯入失敗').then(ok=>{if(ok)toast(`已匯入 ${tasks.length} 筆待辦到雲端`)});
});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));

/* ---------- 介面風格切換 ---------- */
const THEME_COLOR={classic:'#2C5BBF','tech-light':'#2C5BBF','tech-dark':'#060A11'};
function applyUI(){
  const want=state.settings.ui||document.documentElement.dataset.ui;
  const u=THEME_COLOR[want]?want:'tech-light';
  document.documentElement.dataset.ui=u;
  try{localStorage.setItem('todo-ui',u)}catch(e){}
  document.querySelector('meta[name=theme-color]')?.setAttribute('content',THEME_COLOR[u]);
  document.querySelectorAll('[data-ui-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.uiSet===u));
}
$('#uiswitch').addEventListener('click',e=>{const b=e.target.closest('[data-ui-set]');if(!b||!state.loaded)return;const u=b.dataset.uiSet;if(u===state.settings.ui)return;
  state.settings.ui=u;applyUI();persist(()=>API.updateSettings(state.settings.userId,{ui:u}))});

/* ---------- ToDo 標題：四個字輪流、隨機動作 ---------- */
(()=>{
  const letters=[...document.querySelectorAll('h1 .hop')];
  const calm=matchMedia('(prefers-reduced-motion: reduce)');
  const busy=new Set();
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const moves={
    bounce(el){ // 壓扁 → 跳起歪頭 → 落地彈兩下
      const t=(Math.random()<.5?-1:1)*rnd(6,12);
      return {kf:[
        {transform:'translateY(0) scale(1,1) rotate(0deg)'},
        {transform:'translateY(0) scale(1.18,.82) rotate(0deg)',offset:.12},
        {transform:`translateY(-.55em) scale(.9,1.12) rotate(${t}deg)`,offset:.38},
        {transform:'translateY(0) scale(1.15,.85) rotate(0deg)',offset:.6},
        {transform:'translateY(-.12em) scale(.98,1.03) rotate(0deg)',offset:.75},
        {transform:'translateY(0) scale(1.04,.96) rotate(0deg)',offset:.88},
        {transform:'translateY(0) scale(1,1) rotate(0deg)'}],opt:{duration:1000}};
    },
    spin(el){ // 跳上去轉一圈再落下
      const dir=Math.random()<.5?-1:1;
      return {origin:'50% 50%',kf:[
        {transform:'translateY(0) rotate(0deg) scale(1,1)'},
        {transform:'translateY(.05em) rotate(0deg) scale(1.15,.85)',offset:.12},
        {transform:`translateY(-.9em) rotate(${180*dir}deg) scale(1,1)`,offset:.45},
        {transform:`translateY(-.2em) rotate(${360*dir}deg) scale(1,1)`,offset:.7},
        {transform:`translateY(0) rotate(${360*dir}deg) scale(1.15,.85)`,offset:.82},
        {transform:`translateY(-.08em) rotate(${360*dir}deg) scale(1,1)`,offset:.92},
        {transform:`translateY(0) rotate(${360*dir}deg) scale(1,1)`}],opt:{duration:1300}};
    },
    drift(el){ // 飄到畫面右側再飄回來
      const r=el.getBoundingClientRect();
      const dx=Math.max(80,document.documentElement.clientWidth-r.right-28);
      const up=rnd(14,30);
      return {origin:'50% 50%',kf:[
        {transform:'translate(0,0) rotate(0deg)'},
        {transform:`translate(${dx*.15}px,${-up}px) rotate(12deg)`,offset:.12},
        {transform:`translate(${dx*.55}px,${up*.4}px) rotate(-10deg)`,offset:.28},
        {transform:`translate(${dx}px,${-up*.6}px) rotate(8deg)`,offset:.42},
        {transform:`translate(${dx}px,${up*.3}px) rotate(-6deg)`,offset:.55},
        {transform:`translate(${dx*.5}px,${-up}px) rotate(14deg)`,offset:.75},
        {transform:`translate(${dx*.1}px,${up*.3}px) rotate(-6deg)`,offset:.9},
        {transform:'translate(0,0) rotate(0deg)'}],opt:{duration:rnd(4200,5200)}};
    },
  };
  const pick=()=>{const x=Math.random();return x<.45?'bounce':x<.8?'spin':'drift'};
  function play(el,name){
    if(busy.has(el)||calm.matches)return Promise.resolve();
    busy.add(el);const m=moves[name](el);
    if(m.origin)el.style.transformOrigin=m.origin;
    // 每一段各自 ease-in-out，整體時間線維持線性
    const an=el.animate(m.kf.map(k=>({easing:'ease-in-out',...k})),{easing:'linear',...m.opt});
    return an.finished.catch(()=>{}).then(()=>{el.style.transformOrigin='';busy.delete(el)});
  }
  letters.forEach(el=>el.addEventListener('mouseenter',()=>play(el,Math.random()<.6?'bounce':'spin')));
  (async function loop(){
    let i=0;
    for(;;){
      await wait(rnd(700,1400));
      if(document.hidden||calm.matches)continue;
      await play(letters[i],pick());
      i=(i+1)%letters.length;
    }
  })();
})();

/* ---------- 即時時鐘 ---------- */
function tick(){const t=new Date(),p=n=>String(n).padStart(2,'0');
  $('#today').textContent=`${t.getFullYear()}/${p(t.getMonth()+1)}/${p(t.getDate())}（${WD[t.getDay()]}）  ${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}`}
setInterval(tick,1000);

/* ---------- day rollover ---------- */
function checkDay(){const d=todayStr();if(d!==ui.lastDay){ui.lastDay=d;render()}}
setInterval(checkDay,60000);

/* ---------- 自動更新：切回視窗時、以及每 60 秒，從雲端讀取最新資料（手機改的會同步過來） ---------- */
function canAutoRefresh(){
  const ae=document.activeElement;
  return state.loaded&&API.isLoggedIn&&!document.hidden&&!pendingWrites&&!typingWrites.size&&!loading
    &&!document.querySelector('dialog[open]')&&!(ae&&ae.matches&&ae.matches('input,textarea,select'));
}
setInterval(()=>{if(canAutoRefresh())reload()},60000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushAllWrites();return}checkDay();if(canAutoRefresh())reload()});
window.addEventListener('pagehide',flushAllWrites);

/* ---------- boot ---------- */
(async()=>{
  applyUI();
  if(API.isLoggedIn){showApp();await reload()}else showLogin();
  if(document.querySelector('link[rel=manifest]')&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
})();
